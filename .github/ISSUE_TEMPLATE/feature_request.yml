name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Policy:** [Contributing · Open Source](https://vijitdua.com/open-source/contributing)

        - One idea per issue. Search existing issues first.
        - **Not a repo feature?** Use [support](https://vijitdua.com/support/ass) for general feedback.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful for Schedule Builder users?
    validations:
      required: true
