<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Aggie Schedule Sniper</title>
</head>

<body>
  <main class="popup-shell">
    <header class="title-row">
      <button type="button" class="share-btn" id="shareBtn" aria-label="Share Aggie Schedule Sniper" title="Share">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12v8a1 1 0 001 1h14a1 1 0 001-1v-8"></path>
          <path d="M12 3v13"></path>
          <path d="M8 8l4-4 4 4"></path>
        </svg>
      </button>
      <h1>Aggie Schedule Sniper</h1>
      <div class="title-row__spacer" aria-hidden="true"></div>
    </header>

    <div class="settings-block">
      <section class="setting-row">
        <label class="switch" aria-label="Toggle automatic register">
          <input type="checkbox" id="sniperToggle" />
          <span class="slider"></span>
        </label>
        <span class="label">Automatically hit "Register ALL"</span>
      </section>

      <section class="setting-row">
        <label class="switch" aria-label="Toggle pass-time countdown">
          <input type="checkbox" id="countToggle" />
          <span class="slider"></span>
        </label>
        <span class="label">Show pass-time countdown</span>
      </section>
    </div>

    <div id="modeBadge" class="mode-badge" aria-live="polite"></div>

    <footer class="popup-footer">

      <section class="socials" aria-label="Social links">
        <a class="icon-btn" href="https://vijitdua.com/discord" target="_blank" rel="noopener noreferrer"
          title="Discord">
          <svg class="discord-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z">
            </path>
          </svg>
        </a>
        <a class="icon-btn" href="https://instagram.com/vijitdua" target="_blank" rel="noopener noreferrer"
          title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.6" cy="6.4" r="1"></circle>
          </svg>
        </a>
        <a class="icon-btn" href="https://x.com/vijitdua" target="_blank" rel="noopener noreferrer" title="X">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4l6.8 8.8L4.6 20H7l5-5.9L16.7 20H20l-7.1-9.2L19.5 4H17l-4.2 5L7.9 4z"></path>
          </svg>
        </a>
        <a class="icon-btn" href="https://vijitdua.com/links" target="_blank" rel="noopener noreferrer"
          title="All links">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.5 7.2l-2.8 2.8a3 3 0 004.2 4.2l2-2"></path>
            <path d="M13.5 16.8l2.8-2.8a3 3 0 10-4.2-4.2l-2 2"></path>
          </svg>
        </a>
      </section>

      <p class="footer-meta">
        <a class="footer-meta__link footer-meta__built" href="https://vijitdua.com" target="_blank"
          rel="noopener noreferrer">Built by Vijit Dua</a>
        <span class="footer-meta__sep" aria-hidden="true">·</span>
        <a class="footer-meta__link" href="https://vijit.app" target="_blank" rel="noopener noreferrer">More Apps @ vijit.app</a>
        <span class="footer-meta__sep" aria-hidden="true">·</span>
        <a class="footer-meta__link" href="https://vijitdua.com/open-source/contributing" target="_blank"
          rel="noopener noreferrer">Contribute</a>
      </p>
      <p class="footer-meta">
        <a class="footer-meta__link" href="https://vijitdua.com/support" target="_blank"
          rel="noopener noreferrer">Support</a>
        <span class="footer-meta__sep" aria-hidden="true">·</span>
        <button type="button" class="footer-meta__link footer-debug-btn" id="copyDebugBtn">⚙️ Copy debug logs</button>
      </p>
      <p class="popup-version" id="popupVersion" aria-label="Extension version"></p>
    </footer>
  </main>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden></div>

  <script src="branding/official.js"></script>
  <script src="shared/clipboard.js"></script>
  <script src="popup.js"></script>
</body>

</html>
